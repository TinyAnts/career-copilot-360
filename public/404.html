<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Career Co-Pilot 360</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: hsl(228 45% 8%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .grid-bg {
      position: fixed; inset: 0; opacity: .14;
      background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: pan 6s linear infinite;
    }
    @keyframes pan { from { background-position: 0 0; } to { background-position: 48px 48px; } }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); }
    .o1 { width: 420px; height: 420px; background: hsl(230 90% 62% / .35); top: -120px; right: -80px; }
    .o2 { width: 340px; height: 340px; background: hsl(190 95% 55% / .22); bottom: -100px; left: -70px; }
    .card { position: relative; z-index: 1; max-width: 600px; }
    .num {
      font-family: 'Sora', sans-serif; font-weight: 800;
      font-size: clamp(6rem, 20vw, 10rem); line-height: 1;
      background: linear-gradient(95deg, hsl(230 90% 62%), hsl(190 95% 55%));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-family: 'Sora', sans-serif; font-weight: 600; font-size: clamp(1.4rem, 4vw, 2rem); margin: 16px 0 12px; }
    p { color: rgba(219,230,255,.65); font-weight: 300; line-height: 1.7; margin-bottom: 30px; }
    a.btn {
      display: inline-block; text-decoration: none; color: #fff; font-weight: 600;
      padding: 15px 38px; border-radius: 999px;
      background: linear-gradient(95deg, hsl(230 90% 58%), hsl(190 95% 50%));
      box-shadow: 0 14px 40px hsl(230 90% 58% / .4);
      transition: transform .2s, box-shadow .2s;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 46px hsl(230 90% 58% / .5); }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="card">
    <div class="num">404</div>
    <h1>This route isn't on the flight plan.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's navigate you back to base.</p>
    <a class="btn" href="/">Return to mission control</a>
  </div>
</body>
</html>
